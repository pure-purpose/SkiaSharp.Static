name: Deploy action
description: Deploy action

inputs:
  NUGET_KEY:
    description: "The API key for NuGet. Leave empty to skip NuGet publishing."
    required: true

runs:
  using: "composite"
  steps:
    # Proper SemVer prerelease detection: a version is a prerelease when its
    # X.Y.Z core is followed by "-". This covers -preview / -rc / -beta /
    # -gpuN / -svgN, unlike a plain contains(github.ref, '-pre') check which
    # only matches the literal "-pre".
    - name: Detect prerelease tag
      id: detect
      shell: bash
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        if [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+)+- ]]; then
          echo "prerelease=true" >> "$GITHUB_OUTPUT"
        else
          echo "prerelease=false" >> "$GITHUB_OUTPUT"
        fi

    - uses: actions/upload-artifact@v4
      id: upload-artifact-1
      with:
        name: ${{ env.SkiaSharpName }}.7z
        path: ${{ env.SkiaSharpName }}.7z

    - uses: actions/upload-artifact@v4
      id: upload-artifact-2
      with:
        name: ${{ env.HarfBuzzSharpName }}.7z
        path: ${{ env.HarfBuzzSharpName }}.7z

    - uses: actions/upload-artifact@v4
      id: upload-artifact-3
      with:
        name: ${{ env.PackageName }}.nupkg
        path: ${{ env.PackageName }}.nupkg

    - uses: actions/attest-build-provenance@v2
      with:
        subject-name: ${{ env.SkiaSharpName }}.7z
        subject-digest: sha256:${{ steps.upload-artifact-1.outputs.artifact-digest }}

    - uses: actions/attest-build-provenance@v2
      with:
        subject-name: ${{ env.HarfBuzzSharpName }}.7z
        subject-digest: sha256:${{ steps.upload-artifact-2.outputs.artifact-digest }}

    - uses: actions/attest-build-provenance@v2
      with:
        subject-name: ${{ env.PackageName }}.nupkg
        subject-digest: sha256:${{ steps.upload-artifact-3.outputs.artifact-digest }}

    # Publish to NuGet only for a stable tag AND only when a key is provided.
    - if: startsWith(github.ref, 'refs/tags/') && steps.detect.outputs.prerelease == 'false' && inputs.NUGET_KEY != ''
      env:
        NUGET_KEY: ${{ inputs.NUGET_KEY }}
      shell: nu {0}
      run: dotnet nuget push $"($env.PackageName).nupkg" -k $env.NUGET_KEY -s https://api.nuget.org/v3/index.json

    - name: Prerelease artifacts
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/') && steps.detect.outputs.prerelease == 'true'
      with:
        prerelease: true
        files: |
          ${{ env.SkiaSharpName }}.7z
          ${{ env.HarfBuzzSharpName }}.7z
          ${{ env.PackageName }}.nupkg
    - name: Release artifacts
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/') && steps.detect.outputs.prerelease == 'false'
      with:
        files: |
          ${{ env.SkiaSharpName }}.7z
          ${{ env.HarfBuzzSharpName }}.7z
          ${{ env.PackageName }}.nupkg
