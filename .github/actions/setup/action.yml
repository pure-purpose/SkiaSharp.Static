name: Setup action
description: Setup build action
runs:
  using: "composite"
  steps:
    - uses: hustcer/setup-nu@main
      with:
        version: "*"

    - uses: TheMrMilchmann/setup-msvc-dev@v3
      with:
        arch: x64

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        # We only use `uv run --python` as a Python launcher, not a uv project,
        # so there is nothing to cache; caching would only emit a warning.
        enable-cache: false

    - name: Setup depot tools
      uses: 2ndlab/actions/setup-depot-tools@main

    - name: Setup PATH and ENV
      shell: nu {0}
      run: |
        let count = (git rev-list --count HEAD | into int)
        let hash = (git rev-parse --short HEAD)
        let build = $"($count).($hash)"
        [
            $"BuildVersion=($build)"
            $"SkiaSharpName=libSkiaSharp-($env.SkiaSharpVersion)-($build)"
            $"HarfBuzzSharpName=libHarfBuzzSharp-($env.SkiaSharpVersion)-($build)"
            $"BuildDir=($env.GITHUB_WORKSPACE)/out/windows/x64/"
            $"PackageName=2ndLAB.SkiaSharp.Static.($env.SkiaSharpVersion)"
        ] | str join (char newline) | save --append $env.GITHUB_ENV
